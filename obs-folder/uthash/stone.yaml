name        : uthash
version     : "2.4.0"
release     : 1
homepage    : https://github.com/troydhanson/uthash
upstreams   :
    - https://github.com/troydhanson/uthash/archive/refs/tags/v2.4.0.tar.gz : 387ba027946d7c64e9aa19cc53b2edcd714f8f9dca9fa8e3aaef17e0e8e3d736
summary     : C macros for hash tables and more
description : |
    C macros for hash tables and more
license     : BSD-1-Clause
checkdeps   :
    - binary(perl)
install     : |
    %install_dir %(installroot)%(includedir)
    for h in src/*.h; do
        %install_file ${h} -t %(installroot)%(includedir)
    done
check       : |
    %make -C tests
packages    :
    # Headers only package
    - "%(name)" :
        paths :
            - /*
