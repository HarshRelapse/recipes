name        : websocketpp
version     : "0.8.2"
release     : 1
homepage    : https://github.com/zaphoyd/websocketpp
upstreams   :
    - https://github.com/zaphoyd/websocketpp/archive/refs/tags/0.8.2.tar.gz : 6ce889d85ecdc2d8fa07408d6787e7352510750daa66b5ad44aacb47bea76755
summary     : C++ websocket client/server library
description : |
    WebSocket++ is a header only C++ library that implements RFC6455 The WebSocket Protocol.
    It allows integrating WebSocket client and server functionality into C++ programs.
    It uses interchangeable network transport modules including one based on raw char buffers,
    one based on C++ iostreams, and one based on Asio (either via Boost or standalone).
    End users can write additional transport policies to support other networking or event libraries as needed.
license     : BSD
builddeps   :
    - cmake(Boost)
    - cmake(OpenSSL)
    - cmake(ZLIB)
setup       : |

    # From Arch
    %patch %(pkgdir)/websocketpp-0.8.2-boost-1.87-compat.patch

    %cmake \
        -DENABLE_CPP11=ON
build       : |
    %cmake_build
install     : |
    %cmake_install
