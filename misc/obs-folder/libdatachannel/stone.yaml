name        : libdatachannel
version     : "0.24.5"
release     : 1
homepage    : https://github.com/paullouisageneau/libdatachannel
upstreams   :
    - git|https://github.com/paullouisageneau/libdatachannel.git : 443f6934d9007eb7076ab7825ba330f355fcbead # v0.24.5
summary     : C/C++ WebRTC network library featuring Data Channels, Media Transport, and WebSockets
description : |
    libdatachannel is a standalone implementation of WebRTC Data Channels, WebRTC Media Transport,
    and WebSockets in C++ with C bindings for multiple platforms, including GNU/Linux, Android, FreeBSD,
    Apple macOS, iOS, and Microsoft Windows. WebRTC is a W3C and IETF standard enabling real-time peer-to-peer data and media exchange between two devices.
license     : MPL-2.0
builddeps   :
    - pkgconfig(libsrtp2)
    - pkgconfig(openssl)
setup       : |
    %cmake \
        -DUSE_GNUTLS=0 \
        -DUSE_NICE=0 \
        -DUSE_SYSTEM_SRTP=1 \
        -DNO_EXAMPLES=1 \
        -DNO_TESTS=1 \
        -Wno-dev
build       : |
    %cmake_build
install     : |
    %cmake_install
