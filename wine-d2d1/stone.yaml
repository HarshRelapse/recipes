name        : wine-d2d1
version     : "11.16"
release     : 1
homepage    : https://github.com/giang17/wine
upstreams   :
    - https://codeload.github.com/giang17/wine/tar.gz/refs/heads/d2d1-dcomp-11.16 : 02e0197bec27d17a722a562365fc63d0bb4ae4cee375941d54f6161f8fc4ca5b
summary     : Wine patches that make modern Windows audio software work on Linux
description : |
    Wine patches that make modern Windows audio software work on Linux: a DirectComposition implementation plus Direct2D,
    DirectWrite, DXGI, WineD3D and winex11 fixes. Targets JUCE 8, VSTGUI and SynthEdit/GMPI plugin GUIs in DAWs,
    and desktop apps like Ableton Live 12 and FL Studio. Branches for Wine 11.0 stable and the newest WineHQ devel tag
license     : LGPL-2.1-or-later
builddeps   :
    - binary(bison)
    - binary(bsdtar-static)
    - binary(clang)
    - binary(flex)
    - binary(readelf)
    - binary(wayland-scanner)
    - pkgconfig(OpenCL)
    - pkgconfig(OpenCL-Headers)
    - pkgconfig(alsa)
    - pkgconfig(bluez)
    - pkgconfig(cups)
    - pkgconfig(dbus-1)
    - pkgconfig(dri)
    - pkgconfig(egl)
    - pkgconfig(fontconfig)
    - pkgconfig(freetype2)
    - pkgconfig(gbm)
    - pkgconfig(gnutls)
    - pkgconfig(gstreamer-1.0)
    - pkgconfig(gstreamer-tag-1.0)
    - pkgconfig(krb5)
    - pkgconfig(libavcodec)
    - pkgconfig(libavformat)
    - pkgconfig(libavutil)
    - pkgconfig(libgphoto2)
    # - pkgconfig(libinotify)
    - pkgconfig(libpcap)
    - pkgconfig(libpcsclite)
    - pkgconfig(libpulse)
    - pkgconfig(libudev)
    - pkgconfig(libusb-1.0)
    - pkgconfig(libv4l2)
    - pkgconfig(odbc)
    - pkgconfig(sane-backends)
    - pkgconfig(sdl2-compat)
    - pkgconfig(vulkan)
    - pkgconfig(wayland-client)
    - pkgconfig(wayland-eglstream)
    - pkgconfig(xcomposite)
    - pkgconfig(xcursor)
    - pkgconfig(xi)
    - pkgconfig(xinerama)
    - pkgconfig(xkbcommon)
    - pkgconfig(xrandr)
    - pkgconfig(xxf86vm)
    - gettext-devel
    # libnetapi libcapi20
toolchain   : gnu
setup       : |
    %configure \
        --enable-archs=i386,x86_64 \
        --enable-win64
build       : |
    %make
install     : |
    %make_install

    # when building 64+32 compat, only bare name is emitted, add *64 names for compat
    ln -srv %(installroot)/%(bindir)/wine %(installroot)/%(bindir)/wine64

    # binfmt
    %install_file %(pkgdir)/wine-binfmt.conf %(installroot)%(libdir)/binfmt.d/wine.conf

    # Ensure that ntsync is loaded
    %install_file %(pkgdir)/ntsync.conf %(installroot)%(libdir)/modules-load.d/10-wine.conf
tuning      :
    # Breaks build otherwise
    - lto: false
packages    :
    - "%(name)-devel":
        paths:
            - /usr/bin/function_grep.pl
            - /usr/bin/widl
            - /usr/bin/winebuild
            - /usr/bin/winecpp
            - /usr/bin/winedump
            - /usr/bin/wineg++
            - /usr/bin/winegcc
            - /usr/bin/winemaker
            - /usr/bin/wmc
            - /usr/bin/wrc
            - /usr/share/man/man1/widl*
            - /usr/share/man/man1/winebuild*
            - /usr/share/man/man1/winecpp*
            - /usr/share/man/man1/winedump*
            - /usr/share/man/man1/wineg++*
            - /usr/share/man/man1/winegcc*
            - /usr/share/man/**/man1/winemaker*
            - /usr/share/man/man1/wmc*
            - /usr/share/man/man1/wrc*
